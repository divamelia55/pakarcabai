<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — Sistem Pakar Cabai</title>
  <style>
    :root {
      --bg:#ffffff; --text:#0a0a0a; --muted:#6b7280;
      --primary:#16a34a; --primary-foreground:#ffffff; --border:#e5e7eb; --radius:0.75rem;
    }
    body { margin:0; font-family:ui-sans-serif, system-ui; background:#f8fafc; }
    header { background:#fff; padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
    header h1 { margin:0; font-size:1.5rem; color:var(--primary); }
    header a { color:var(--primary); text-decoration:none; font-weight:600; }
    main { padding:2rem; }
    .card { background:#fff; padding:2rem; border-radius:var(--radius); box-shadow:0 8px 20px rgba(0,0,0,0.05); margin-bottom:1.5rem; }
    h2 { margin-top:0; color:var(--primary); }
    p { color:var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1>Dashboard User</h1>
    <a href="login-register.html">Logout</a>
  </header>

  <main>
    <div class="card">
      <h2>Riwayat Diagnosa</h2>
      <p>Placeholder: akan menampilkan riwayat diagnosa pengguna.</p>
    </div>

    <div class="card">
      <h2>Rekomendasi Penyakit</h2>
      <p>Placeholder: akan menampilkan hasil diagnosa terakhir dan saran tindak lanjut.</p>
    </div>
  </main>

</body>
</html>
